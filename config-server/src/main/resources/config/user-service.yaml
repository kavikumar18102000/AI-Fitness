server:
  port: 9091

spring:
  application:
    name: user-service

  datasource:
    url: jdbc:postgresql://localhost:5440/fitness_user
    username: postgres
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    service-url:
      defaultZone: http://localhost:9093/eureka