server:
  port: 9090

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: lb://USER-SERVICE #lb-> load balancer
              predicates:
                - Path=/api/users/**

            - id: activity-service
              uri: lb://ACTIVITY-SERVICE #lb-> load balancer
              predicates:
                - Path=/api/activities/**

            - id: ai-service
              uri: lb://AI-SERVICE #lb-> load balancer
              predicates:
                - Path=/api/recommendation/**

#config for application to talk to keycloak
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8080/realms/fitness-oauth2/protocol/openid-connect/certs

eureka:
  client:
    service-url:
      defaultZone: http://localhost:9093/eureka



